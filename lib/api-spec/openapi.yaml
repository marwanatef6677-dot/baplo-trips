openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: support
    description: Customer support and owner ticket review
  - name: openai
    description: OpenAI support assistant
  - name: storage
    description: Private profile photo uploads and serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /config:
    get:
      operationId: getConfig
      responses:
        "200":
          description: Public service configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppConfig"
  /profile:
    get:
      operationId: getProfile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
    patch:
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /storage/profile-photos/request-upload:
    post:
      operationId: requestProfilePhotoUpload
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoUploadRequest"
      responses:
        "200":
          description: Short-lived private upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoUploadResponse"
  /storage/profile-photos/complete:
    post:
      operationId: completeProfilePhotoUpload
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePhotoCompleteRequest"
      responses:
        "200":
          description: Image verified and saved to the current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoCompleteResponse"
  /storage/profile-photos/me/avatar:
    get:
      operationId: getMyAvatarPhoto
      tags: [storage]
      responses:
        "200":
          description: Private customer profile image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: No profile image is set
  /storage/profile-photos/me/vehicle:
    get:
      operationId: getMyCaptainVehiclePhoto
      tags: [storage]
      responses:
        "200":
          description: Private captain-with-vehicle image
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: No captain image is set
  /storage/profiles/{id}/avatar:
    get:
      operationId: getProfileAvatarPhoto
      tags: [storage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Profile image available to signed-in Pablo users
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: No profile image is set
  /storage/driver-documents/request-upload:
    post:
      operationId: requestDriverDocumentUpload
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDocumentUploadRequest"
      responses:
        "200":
          description: Short-lived private upload URL for a captain document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfilePhotoUploadResponse"
  /storage/driver-documents/complete:
    post:
      operationId: completeDriverDocumentUpload
      tags: [storage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverDocumentCompleteRequest"
      responses:
        "200":
          description: The private document was validated and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverDocumentCompleteResponse"
  /storage/admin/drivers/{id}/documents/{documentType}:
    get:
      operationId: getAdminDriverDocument
      tags: [storage]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: documentType
          in: path
          required: true
          schema: { type: string, enum: [driver_license_front, driver_license_back, vehicle_license_front, vehicle_license_back] }
      responses:
        "200":
          description: Private document image, available to administrators only
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: Document not found
  /storage/profiles/{id}/vehicle:
    get:
      operationId: getProfileVehiclePhoto
      tags: [storage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Captain-with-vehicle image available to signed-in Pablo users
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: No captain image is set
  /admin/pablo-feedback:
    get:
      operationId: getPabloFeedbackSummary
      responses:
        "200":
          description: Pablo ratings and recent customer feedback (owner only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PabloFeedbackSummary"
  /storage/admin/drivers/{id}/vehicle-photo:
    get:
      operationId: getDriverReviewPhoto
      tags: [storage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Private captain-with-vehicle image for owner review
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: Image not found
  /storage/rides/{id}/driver-photo:
    get:
      operationId: getRideDriverPhoto
      tags: [storage]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Assigned captain image, available only to ride participants
          content:
            image/*:
              schema: { type: string, format: binary }
        "404":
          description: Image not found or ride unavailable
  /rides:
    get:
      operationId: listRides
      responses:
        "200":
          description: My trips as passenger or assigned driver
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ride"
    post:
      operationId: createRide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideInput"
      responses:
        "201":
          description: Trip requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
  /rides/available:
    get:
      operationId: listAvailableRides
      responses:
        "200":
          description: Pending requests in driver's province, no passenger contact data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ride"
  /rides/{id}:
    get:
      operationId: getRide
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Trip detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
  /rides/{id}/action:
    post:
      operationId: actOnRide
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideAction"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ride"
  /rides/{id}/messages:
    get:
      operationId: listRideMessages
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Ride conversation for its customer and assigned captain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RideMessage"
    post:
      operationId: sendRideMessage
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideMessage"
  /routes/preview:
    post:
      operationId: previewRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteInput"
      responses:
        "200":
          description: Route distance, estimated time, and service-specific fare estimate; traffic is not included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoutePreview"
  /rides/{id}/location:
    get:
      operationId: getRideLocation
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Last driver position, only for ride participants while active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingState"
    put:
      operationId: updateRideLocation
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationInput"
      responses:
        "200":
          description: Saved location, assigned driver only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingState"
    delete:
      operationId: stopRideTracking
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Sharing stopped and last location erased
  /summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Personal ride counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
  /admin/drivers:
    get:
      operationId: listDriverReviews
      responses:
        "200":
          description: Driver accounts needing administrative review
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DriverReview" }
  /admin/drivers/{id}/review:
    post:
      operationId: reviewDriver
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DriverReviewInput"
      responses:
        "200":
          description: Saved driver review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverReview"
  /openai/support-chat:
    post:
      operationId: sendOpenaiSupportChat
      tags: [openai]
      summary: Stream a support assistant response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportChatInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: List the signed-in customer's support tickets
      responses:
        "200":
          description: Customer's support tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportTicket" }
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: Create a support ticket for the signed-in customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketInput"
      responses:
        "201":
          description: Support ticket created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicket"
  /admin/support-tickets:
    get:
      operationId: listAdminSupportTickets
      tags: [support]
      summary: List support tickets for the authorized owner
      responses:
        "200":
          description: Support ticket queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportTicketAdmin" }
  /admin/support-tickets/{id}:
    patch:
      operationId: updateAdminSupportTicket
      tags: [support]
      summary: Update a support ticket status or owner note
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportTicketUpdate"
      responses:
        "200":
          description: Updated support ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketAdmin"
  /wallet:
    get:
      operationId: getWallet
      responses:
        "200":
          description: Captain wallet balance and recent movements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /wallet/topups:
    post:
      operationId: createWalletTopup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletTopupInput"
      responses:
        "201":
          description: FawryPay top-up request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTopup"
  /wallet/topups/{id}:
    get:
      operationId: getWalletTopup
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Top-up status (owner only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletTopup"
  /fawry/notify:
    post:
      operationId: fawryPaymentNotification
      description: Validates FawryPay's signed server notification and applies a top-up once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FawryNotificationInput"
      responses:
        "200":
          description: Notification acknowledged
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AppConfig:
      type: object
      required: [provinces, rideTypes, fareDescriptions, notice]
      properties:
        provinces: { type: array, items: { type: string } }
        rideTypes: { type: array, items: { $ref: "#/components/schemas/RideType" } }
        fareDescriptions:
          type: object
          required: [car, motorcycle, delivery]
          properties:
            car: { type: string }
            motorcycle: { type: string }
            delivery: { type: string }
        notice: { type: string }
    RideType:
      type: object
      required: [id, name, description, seats]
      properties:
        id: { type: string, enum: [economy, family, premium, motorcycle] }
        name: { type: string }
        description: { type: string }
        seats: { type: integer }
    Profile:
      type: object
      required: [id, name, phone, role, province, vehicle, vehicleType, plate, onboarded, customerTermsAccepted, customerTermsAcceptedAt, driverReviewStatus, driverTermsAccepted, hasAvatarPhoto, hasCaptainVehiclePhoto, hasDriverLicenseFront, hasDriverLicenseBack, hasVehicleLicenseFront, hasVehicleLicenseBack, captainPhotoVerified, walletBalancePiasters, driverCompletedRides, driverRating, driverLevel, ridesToNextLevel]
      properties:
        id: { type: string }
        name: { type: string }
        phone: { type: string }
        role: { type: string, enum: [customer, driver] }
        province: { type: string }
        vehicle: { type: string }
        vehicleType: { type: string, enum: [car, motorcycle] }
        plate: { type: string }
        onboarded: { type: boolean }
        customerTermsAccepted: { type: boolean }
        customerTermsAcceptedAt: { type: [string, "null"] }
        hasAvatarPhoto: { type: boolean }
        hasCaptainVehiclePhoto: { type: boolean }
        hasDriverLicenseFront: { type: boolean }
        hasDriverLicenseBack: { type: boolean }
        hasVehicleLicenseFront: { type: boolean }
        hasVehicleLicenseBack: { type: boolean }
        captainPhotoVerified: { type: boolean }
        driverReviewStatus: { type: string, enum: [pending, approved, rejected, suspended] }
        driverTermsAccepted: { type: boolean }
        walletBalancePiasters: { type: integer }
        driverCompletedRides: { type: integer, minimum: 0 }
        driverRating: { type: [number, "null"], minimum: 1, maximum: 5 }
        driverLevel: { type: integer, minimum: 0, maximum: 10 }
        ridesToNextLevel: { type: integer, minimum: 0, maximum: 10 }
    ProfileInput:
      type: object
      required: [name, phone, role, province, vehicle, vehicleType, plate, driverTermsAccepted]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, pattern: '^(01[0125][0-9]{8}|\+201[0125][0-9]{8})$' }
        role: { type: string, enum: [customer, driver] }
        province: { type: string, minLength: 2, maxLength: 50 }
        vehicle: { type: string, maxLength: 80 }
        vehicleType: { type: string, enum: [car, motorcycle] }
        plate: { type: string, maxLength: 30 }
        driverTermsAccepted: { type: boolean }
        driverTermsSignature: { type: string, maxLength: 80 }
        customerAge18Attested: { type: boolean }
        customerTermsAccepted: { type: boolean }
        customerTermsSignature: { type: string, maxLength: 80 }
    ProfilePhotoUploadRequest:
      type: object
      required: [purpose, name, size, contentType]
      properties:
        purpose: { type: string, enum: [avatar, captain_vehicle] }
        name: { type: string, minLength: 1, maxLength: 180 }
        size: { type: integer, minimum: 1, maximum: 5242880 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    ProfilePhotoUploadResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    ProfilePhotoCompleteRequest:
      type: object
      required: [purpose, objectPath]
      properties:
        purpose: { type: string, enum: [avatar, captain_vehicle] }
        objectPath: { type: string, minLength: 1, maxLength: 500 }
    ProfilePhotoCompleteResponse:
      type: object
      required: [hasAvatarPhoto, hasCaptainVehiclePhoto]
      properties:
        hasAvatarPhoto: { type: boolean }
        hasCaptainVehiclePhoto: { type: boolean }
    DriverDocumentUploadRequest:
      type: object
      required: [documentType, size, contentType]
      properties:
        documentType: { type: string, enum: [driver_license_front, driver_license_back, vehicle_license_front, vehicle_license_back] }
        size: { type: integer, minimum: 1, maximum: 5242880 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    DriverDocumentCompleteRequest:
      type: object
      required: [documentType, objectPath]
      properties:
        documentType: { type: string, enum: [driver_license_front, driver_license_back, vehicle_license_front, vehicle_license_back] }
        objectPath: { type: string, minLength: 1, maxLength: 500 }
    DriverDocumentCompleteResponse:
      type: object
      required: [documentType, uploaded]
      properties:
        documentType: { type: string, enum: [driver_license_front, driver_license_back, vehicle_license_front, vehicle_license_back] }
        uploaded: { type: boolean }
    RideInput:
      type: object
      required: [pickup, destination, province, rideType, serviceType, pickupLat, pickupLng, destinationLat, destinationLng]
      properties:
        pickup: { type: string, minLength: 3, maxLength: 240 }
        destination: { type: string, minLength: 3, maxLength: 240 }
        province: { type: string, minLength: 2, maxLength: 50 }
        rideType: { type: string, enum: [economy, family, premium, motorcycle] }
        serviceType: { type: string, enum: [passenger, delivery] }
        deliveryDescription: { type: string, maxLength: 300 }
        recipientName: { type: string, maxLength: 80 }
        recipientPhone: { type: string, pattern: '^(01[0125][0-9]{8}|\+201[0125][0-9]{8})$' }
        pickupLat: { type: number, minimum: -90, maximum: 90 }
        pickupLng: { type: number, minimum: -180, maximum: 180 }
        destinationLat: { type: number, minimum: -90, maximum: 90 }
        destinationLng: { type: number, minimum: -180, maximum: 180 }
        notes: { type: string, maxLength: 500 }
        fareAdjustmentPiasters: { type: integer, multipleOf: 500, minimum: -1000000, maximum: 1000000 }
    RideAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, arrive, start, complete, cancel, rate, check_in] }
        rating: { type: integer, minimum: 1, maximum: 5 }
        pabloRating: { type: integer, minimum: 1, maximum: 5 }
        pabloFeedbackNote: { type: string, maxLength: 500 }
        checkInStatus: { type: string, enum: [all_good, need_help] }
        captainRating: { type: integer, minimum: 1, maximum: 5 }
        drivingRating: { type: integer, minimum: 1, maximum: 5 }
        cleanlinessRating: { type: integer, minimum: 1, maximum: 5 }
        comfortRating: { type: integer, minimum: 1, maximum: 5 }
        airConditioningRating: { type: integer, minimum: 1, maximum: 5 }
        feedbackNote: { type: string, maxLength: 500 }
    RideMessage:
      type: object
      required: [id, rideId, senderId, senderName, message, createdAt]
      properties:
        id: { type: integer }
        rideId: { type: integer }
        senderId: { type: string }
        senderName: { type: string }
        message: { type: string }
        createdAt: { type: string }
    RideMessageInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1000 }
    Ride:
      type: object
      required: [id, customerId, driverId, customerName, driverName, driverPhone, customerPhone, vehicle, plate, pickup, destination, province, rideType, serviceType, deliveryDescription, recipientName, recipientPhone, status, createdAt, updatedAt, notes, rating, checkInStatus, captainRating, drivingRating, cleanlinessRating, comfortRating, airConditioningRating, feedbackNote, pabloRating, pabloFeedbackNote, feedbackSubmittedAt, pickupLat, pickupLng, destinationLat, destinationLng, routeDistanceMeters, routeDurationSeconds, estimatedFarePiasters, farePiasters, commissionPiasters, commissionState, promoCommissionWaived]
      properties:
        id: { type: integer }
        customerId: { type: string }
        driverId: { type: [string, "null"] }
        customerName: { type: string }
        driverName: { type: [string, "null"] }
        driverPhone: { type: [string, "null"] }
        customerPhone: { type: [string, "null"] }
        vehicle: { type: [string, "null"] }
        plate: { type: [string, "null"] }
        pickup: { type: string }
        destination: { type: string }
        province: { type: string }
        rideType: { type: string, enum: [economy, family, premium, motorcycle] }
        serviceType: { type: string, enum: [passenger, delivery] }
        deliveryDescription: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        status: { type: string, enum: [pending, accepted, arrived, in_progress, completed, cancelled] }
        createdAt: { type: string }
        updatedAt: { type: string }
        notes: { type: string }
        rating: { type: [integer, "null"] }
        checkInStatus: { type: [string, "null"], enum: [all_good, need_help, "null"] }
        captainRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        drivingRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        cleanlinessRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        comfortRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        airConditioningRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        feedbackNote: { type: string }
        pabloRating: { type: [integer, "null"], minimum: 1, maximum: 5 }
        pabloFeedbackNote: { type: string }
        feedbackSubmittedAt: { type: ["string", "null"] }
        pickupLat: { type: [number, "null"] }
        pickupLng: { type: [number, "null"] }
        destinationLat: { type: [number, "null"] }
        destinationLng: { type: [number, "null"] }
        routeDistanceMeters: { type: [integer, "null"] }
        routeDurationSeconds: { type: [integer, "null"] }
        estimatedFarePiasters: { type: [integer, "null"] }
        farePiasters: { type: [integer, "null"] }
        commissionPiasters: { type: [integer, "null"] }
        commissionState: { type: [string, "null"], enum: [reserved, retained, refunded, waived, "null"] }
        promoCommissionWaived: { type: boolean }
    RouteInput:
      type: object
      required: [pickupLat, pickupLng, destinationLat, destinationLng, rideType, serviceType]
      properties:
